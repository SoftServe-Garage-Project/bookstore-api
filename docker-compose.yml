version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: bookstore_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore_user
      POSTGRES_PASSWORD: bookstore_pass
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
