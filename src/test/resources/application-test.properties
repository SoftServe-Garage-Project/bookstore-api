# JWT Settings for tests (required for security components)
jwt.secret.key=test-secret-key-for-unit-tests-must-be-at-least-256-bits-long-to-work-properly
jwt.access.expiration=3600000
jwt.refresh.expiration=86400000

# Token limits for tests
security.token.max-refresh-tokens-per-user=5

# Logging
logging.level.com.softserve.bookstoreapi=WARN
logging.level.org.springframework.security=WARN

